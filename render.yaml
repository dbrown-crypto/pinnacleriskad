services:
  - type: web
    name: pinnacle-property-lookup
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn property_lookup:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: RENTCAST_API_KEY
        sync: false
      - key: FMCSA_WEB_KEY
        sync: false
